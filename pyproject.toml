[project]
name = "good-terms"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
